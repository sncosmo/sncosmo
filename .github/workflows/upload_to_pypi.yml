name: Build and upload to PyPI

on:
  release:
    types: [published]
  # Build (but do not upload) wheels when the packaging config changes, or on
  # demand, so build failures surface before a release instead of during one.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upload_to_pypi.yml
      - pyproject.toml
      - setup.py
      - setup.cfg

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.x'

      - name: Build wheels
        # Fail loudly: a silently failed build previously shipped a release
        # with no Linux wheels. Python versions are selected in pyproject.toml.
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.x'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@v4.1.7
        with:
          path: dist
          merge-multiple: true  # put contents of each wheel folder into dist/
          pattern: wheels-*

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
